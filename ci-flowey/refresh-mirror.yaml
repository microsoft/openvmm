#    DO NOT MANUALLY EDIT    #
##############################
trigger:
  batch: true
  branches:
    include:
    - main
    - release/1.7.2511
    - release/1.8.2607
    - release/2411
    - release/2505
pr: none
pool:
  vmImage: ubuntu-latest
jobs:
- job: QueueMirror
  condition: and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables['Build.Repository.Name'], 'microsoft/openvmm'))
  steps:
  - checkout: none
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $routes = ConvertFrom-Json -AsHashtable $env:MIRROR_ROUTES
      if ($env:BUILD_SOURCEBRANCH -cnotmatch '^refs/heads/(.+)$' -or !$routes.ContainsKey($Matches[1])) {
          throw "No mirror route for $env:BUILD_SOURCEBRANCH"
      }
      $branch = $Matches[1]
      $body = @{
          templateParameters = @{
              branchToMirror = $branch
              branchToUpdateSubmodule = $routes[$branch]
              updateSubmodule = $true
          }
      } | ConvertTo-Json

      $run = Invoke-RestMethod -Method Post `
          -Uri 'https://dev.azure.com/microsoft/HyperVCloud/_apis/pipelines/149443/runs?api-version=7.1' `
          -Headers @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" } `
          -MaximumRedirection 0 -ContentType 'application/json' -Body $body
      Write-Host "Queued mirror refresh $($run.id) for $branch"
    displayName: Queue mirror refresh
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      MIRROR_ROUTES: '{"main":"main","release/1.7.2511":"staging/1.7.2511","release/1.8.2607":"staging/1.8.2607","release/2411":"staging/1.5.2411","release/2505":"staging/1.6.2505"}'
