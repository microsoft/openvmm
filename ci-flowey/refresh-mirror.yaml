#    DO NOT MANUALLY EDIT    #
##############################
trigger:
  batch: true
  branches:
    include:
    - main
pr: none
jobs:
- job: QueueMirror
  displayName: Queue mirror refresh
  pool:
    vmImage: ubuntu-latest
  dependsOn: []
  condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables['Build.Repository.Name'], 'microsoft/openvmm'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
  - name: FLOWEY_TEMP_DIR
    value: $(Build.StagingDirectory)/.flowey-internal
  steps:
  - bash: |
      set -x
      i=0; while [ $i -lt 5 ] && ! sudo apt-get update; do let "i=i+1"; sleep 1; done;
      sudo apt-get -o DPkg::Lock::Timeout=60 install gcc libc6-dev -y --no-install-recommends
      curl --fail --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain=1.97.1 -y
      . "$HOME/.cargo/env"
      echo '##vso[task.prependpath]$(HOME)/.cargo/bin'
    condition: eq(variables['Agent.OS'], 'Linux')
    displayName: rustup (Linux)
  - bash: |
      set -x
      rustup show
    displayName: Verify rustup installation
  - checkout: self
    fetchTags: false
    fetchDepth: 1
    path: flowey_bootstrap
  - bash: CARGO_INCREMENTAL=0 cargo build -p flowey_hvlite --target x86_64-unknown-linux-gnu --profile flowey-ci
    workingDirectory: ../flowey_bootstrap
    displayName: Build flowey
  - bash: |
      mkdir ./flowey_bootstrap_temp
      mv ./ci-flowey/refresh-mirror.yaml ./flowey_bootstrap_temp/pipeline.yaml
      mv ./ci-flowey/refresh-mirror.json ./flowey_bootstrap_temp/pipeline.json
      mv target/x86_64-unknown-linux-gnu/flowey-ci/flowey_hvlite ./flowey_bootstrap_temp/flowey
    workingDirectory: ../flowey_bootstrap
    displayName: Stage flowey artifact
  - task: CopyFiles@2
    displayName: Copy flowey artifact
    inputs:
      SourceFolder: ../flowey_bootstrap/flowey_bootstrap_temp
      TargetFolder: $(FLOWEY_TEMP_DIR)/bootstrapped-flowey
  - bash: rm -rf ./flowey_bootstrap_temp
    workingDirectory: ../flowey_bootstrap
    displayName: Cleanup staged flowey artifact
  - bash: |
      set -e
      AgentTempDirNormal="$(FLOWEY_TEMP_DIR)"
      AgentTempDirNormal=$(echo "$AgentTempDirNormal" | sed -e 's|\\|\/|g' -e 's|^\([A-Za-z]\)\:/\(.*\)|/\L\1\E/\2|')
      echo "##vso[task.setvariable variable=AgentTempDirNormal;]$AgentTempDirNormal"

      chmod +x $AgentTempDirNormal/bootstrapped-flowey/flowey
      FLOWEY_BIN="$AgentTempDirNormal/bootstrapped-flowey/flowey"
      echo "##vso[task.setvariable variable=FLOWEY_BIN;]$FLOWEY_BIN"
    displayName: Set flowey path
  - bash: |-
      ESCAPED_AGENT_TEMPDIR=$(
      cat <<'EOF' | sed 's/\\/\\\\/g'
      $(FLOWEY_TEMP_DIR)
      EOF
      )
      $(FLOWEY_BIN) pipeline ado --runtime $ESCAPED_AGENT_TEMPDIR/bootstrapped-flowey/pipeline.yaml --out ci-flowey/refresh-mirror.yaml ci refresh-mirror
    displayName: 🌼🔎 Self-check YAML
  - bash: |+
      set -e
      echo '"debug"' | $FLOWEY_BIN v 0 'FLOWEY_LOG' update
      echo "$(FLOWEY_TEMP_DIR)/work" | $FLOWEY_BIN v 0 '_internal_WORKING_DIR' --is-raw-string update

    displayName: 🌼🛫 Initialize job
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $run = Invoke-RestMethod -Method Post `
          -Uri 'https://dev.azure.com/microsoft/HyperVCloud/_apis/pipelines/149443/runs?api-version=7.1' `
          -Headers @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" } `
          -MaximumRedirection 0 -ContentType 'application/json' -Body $env:MIRROR_REQUEST
      Write-Host "Queued mirror refresh $($run.id)"
    env:
      MIRROR_REQUEST: '{"templateParameters":{"branchToMirror":"main","branchToUpdateSubmodule":"main","updateSubmodule":true}}'
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    displayName: Queue downstream mirror pipeline
