# `netvsp_protocol` — shared NVSP + RNDIS wire types.
#
# Extracted from the `netvsp` (host-side vsp) crate so guest-side drivers
# (opentmk's `vmbus_guest::devices::netvsp`) can consume the same wire
# structs without pulling in the host-side vdev framework or its `std`
# dependencies.

[package]
name = "netvsp_protocol"
edition.workspace = true
rust-version.workspace = true

[dependencies]
inspect.workspace = true
vmbus_core.workspace = true

bitfield-struct.workspace = true
open_enum.workspace = true
static_assertions.workspace = true
zerocopy.workspace = true

[lints]
workspace = true
