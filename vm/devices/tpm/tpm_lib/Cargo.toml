[package]
name = "tpm_lib"
rust-version.workspace = true
edition.workspace = true

[features]
# Use this feature to enable tests that pull in `ms-tpm-20-ref` and `ms-tcg-tpm-sys`.
test_tpm = ["dep:ms-tpm-20-ref", "dep:ms-tcg-tpm-sys"]

[dependencies]
tpm_protocol.workspace = true
ms-tpm-20-ref = { optional = true, workspace = true }
ms-tcg-tpm-sys = { optional = true, workspace = true }
cvm_tracing.workspace = true
inspect.workspace = true

thiserror.workspace = true
tracelimit.workspace = true
tracing.workspace = true
zerocopy.workspace = true

[dev-dependencies]
getrandom.workspace = true

[[test]]
name = "tpm_1_38"
required-features = ["test_tpm"]

[[test]]
name = "tpm_1_85"
required-features = ["test_tpm"]

[lints]
workspace = true
