[package]
name = "tpm_utils"
edition.workspace = true
rust-version.workspace = true

[features]
default = []

# Without this feature, the tool is a no-op. Disabled by default because the TPM
# reference implementations require an OpenSSL crypto backend, which isn't
# available everywhere the workspace is built.
tpm = ["dep:ms-tpm-20-ref", "dep:ms-tcg-tpm-sys"]

# Build OpenSSL from source instead of linking against the system library.
vendored = ["ms-tpm-20-ref?/vendored", "ms-tcg-tpm-sys?/vendored"]

[dependencies]
tpm_lib.workspace = true
tpm_protocol.workspace = true
tpm_resources.workspace = true
ms-tpm-20-ref = { optional = true, workspace = true, features = ["openssl"] }
ms-tcg-tpm-sys = { optional = true, workspace = true, features = ["openssl"] }

anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
fs-err.workspace = true
getrandom.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
