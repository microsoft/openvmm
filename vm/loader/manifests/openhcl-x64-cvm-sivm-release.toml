guest_arch = "x64"

# ----------------------------------------------------------------------------
# VBS isolation
# ----------------------------------------------------------------------------
[guest_configs.vbs]
guest_svn = 13
max_vtl = 2

[guest_configs.vbs.isolation]
enable_debug = false

[guest_configs.vbs.image.openhcl]
command_line = ""
static_command_line = true
memory_page_count = 16384
memory_page_base = 32768
uefi = true

[guest_configs.vbs.image.openhcl.product_policy.policy.sivm]
require_ephemeral_vmgs = false
require_secure_boot = false
require_secure_boot_vars = false
require_bcd_integrity = false
custom_uefi_json = ""

[guest_configs.vbs.image.openhcl.product_policy.policy.sivm.device_policy]
devices = "policies/devices.toml"
allowed_pci_devices = ["nvidia-gpu"]
vpci_relay = "must_be_on"
