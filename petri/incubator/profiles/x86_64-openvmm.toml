# Copy this profile outside the checkout and supply the native launcher path.
[incubator]
type = "openvmm"
arch = "x86-64"
binary = "/path/to/native/openvmm"
memory = "4G"
processors = 2
nested-virt = true

[boot]
type = "linux-direct"
