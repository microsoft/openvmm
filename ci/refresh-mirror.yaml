# Test-only: allow this branch to request a main-to-main refresh.
trigger:
  batch: true
  branches:
    include:
    - copilot/test-mirror-refresh
pr: none

variables:
  submoduleTarget: main

pool:
  name: openvmm-ado-amd-westus2-v6
  demands:
  - ImageOverride -equals ubuntu2404-amd64-prepped

jobs:
- job: QueueMirror
  condition: and(succeeded(), in(variables['Build.Reason'], 'Manual', 'IndividualCI', 'BatchedCI'), eq(variables['Build.Repository.Name'], 'microsoft/openvmm'), eq(variables['Build.SourceBranch'], 'refs/heads/copilot/test-mirror-refresh'))
  steps:
  - checkout: none
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      if ($env:BUILD_SOURCEBRANCH -cne 'refs/heads/copilot/test-mirror-refresh') {
          throw "Unexpected source ref: $env:BUILD_SOURCEBRANCH"
      }
      $branch = 'main'
      $body = @{
          templateParameters = @{
              branchToMirror = $branch
              branchToUpdateSubmodule = $env:SUBMODULE_TARGET
              updateSubmodule = $true
          }
      } | ConvertTo-Json

      $run = Invoke-RestMethod -Method Post `
          -Uri 'https://dev.azure.com/microsoft/HyperVCloud/_apis/pipelines/149443/runs?api-version=7.1' `
          -Headers @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" } `
          -MaximumRedirection 0 -ContentType 'application/json' -Body $body
      Write-Host "Queued mirror refresh $($run.id) for $branch"
    displayName: Queue downstream mirror pipeline
    env:
      SUBMODULE_TARGET: ${{ variables.submoduleTarget }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
