# On backport, update the trigger branch and its downstream submodule target.
trigger:
  batch: true
  branches:
    include:
    - main
pr: none

variables:
  submoduleTarget: main

pool:
  vmImage: ubuntu-latest

jobs:
- job: QueueMirror
  condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables['Build.Repository.Name'], 'microsoft/openvmm'))
  steps:
  - checkout: none
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      if ($env:BUILD_SOURCEBRANCH -cnotmatch '^refs/heads/(.+)$') {
          throw "Unexpected source ref: $env:BUILD_SOURCEBRANCH"
      }
      $branch = $Matches[1]
      $body = @{
          templateParameters = @{
              branchToMirror = $branch
              branchToUpdateSubmodule = $env:SUBMODULE_TARGET
              updateSubmodule = $true
          }
      } | ConvertTo-Json

      $run = Invoke-RestMethod -Method Post `
          -Uri 'https://dev.azure.com/microsoft/HyperVCloud/_apis/pipelines/149443/runs?api-version=7.1' `
          -Headers @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" } `
          -MaximumRedirection 0 -ContentType 'application/json' -Body $body
      Write-Host "Queued mirror refresh $($run.id) for $branch"
    displayName: Queue downstream mirror pipeline
    env:
      SUBMODULE_TARGET: ${{ variables.submoduleTarget }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
