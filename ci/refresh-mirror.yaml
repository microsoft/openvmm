##############################
# Test-only copy: trigger on this branch but request a main-to-main refresh.
trigger:
  batch: true
  branches:
    include:
    - copilot/test-mirror-refresh
pr: none
variables:
- name: submoduleTarget
  value: main
jobs:
- job: QueueMirror
  displayName: Queue mirror refresh
  pool:
    demands:
    - ImageOverride -equals ubuntu2404-amd64-prepped
    name: openvmm-ado-amd-westus2-v6
  dependsOn: []
  condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables['Build.Repository.Name'], 'microsoft/openvmm'), eq(variables['Build.SourceBranch'], 'refs/heads/copilot/test-mirror-refresh'))
  steps:
  - checkout: none
  - bash: |
      set -euo pipefail
      python3 - <<'PY'
      import json
      import os
      import urllib.request

      ref = os.environ["BUILD_SOURCEBRANCH"]
      if not ref.startswith("refs/heads/") or ref == "refs/heads/":
          raise ValueError("Unexpected source ref")
      branch = ref.removeprefix("refs/heads/")
      body = json.dumps({"templateParameters": {
          "branchToMirror": branch,
          "branchToUpdateSubmodule": os.environ["SUBMODULE_TARGET"],
          "updateSubmodule": True,
      }}).encode()
      request = urllib.request.Request(
          "https://dev.azure.com/microsoft/HyperVCloud/_apis/pipelines/149443/runs?api-version=7.1",
          data=body,
          headers={
              "Authorization": "Bearer " + os.environ["SYSTEM_ACCESSTOKEN"],
              "Content-Type": "application/json",
          },
          method="POST",
      )
      with urllib.request.urlopen(request, timeout=60) as response:
          run = json.load(response)
      print(f"Queued mirror refresh {run['id']} for {branch}")
      PY
    env:
      BUILD_SOURCEBRANCH: refs/heads/main
      SUBMODULE_TARGET: ${{ variables.submoduleTarget }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    displayName: Queue downstream mirror pipeline
