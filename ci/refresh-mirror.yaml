# Test-only: allow this branch to request a main-to-main refresh.
trigger:
  batch: true
  branches:
    include:
    - copilot/test-mirror-refresh
pr: none

variables:
  submoduleTarget: main

pool:
  name: openvmm-ado-amd-westus2-v6
  demands:
  - ImageOverride -equals ubuntu2404-amd64-prepped

jobs:
- job: QueueMirror
  condition: and(succeeded(), in(variables['Build.Reason'], 'Manual', 'IndividualCI', 'BatchedCI'), eq(variables['Build.Repository.Name'], 'microsoft/openvmm'), eq(variables['Build.SourceBranch'], 'refs/heads/copilot/test-mirror-refresh'))
  steps:
  - checkout: none
  - bash: |
      set -euo pipefail
      python3 - <<'PY'
      import json
      import os
      import urllib.request

      if os.environ["BUILD_SOURCEBRANCH"] != "refs/heads/copilot/test-mirror-refresh":
          raise ValueError("Unexpected source ref")
      branch = "main"
      body = json.dumps({"templateParameters": {
          "branchToMirror": branch,
          "branchToUpdateSubmodule": os.environ["SUBMODULE_TARGET"],
          "updateSubmodule": True,
      }}).encode()
      request = urllib.request.Request(
          "https://dev.azure.com/microsoft/HyperVCloud/_apis/pipelines/149443/runs?api-version=7.1",
          data=body,
          headers={
              "Authorization": "Bearer " + os.environ["SYSTEM_ACCESSTOKEN"],
              "Content-Type": "application/json",
          },
          method="POST",
      )
      with urllib.request.urlopen(request, timeout=60) as response:
          run = json.load(response)
      print(f"Queued mirror refresh {run['id']} for {branch}")
      PY
    displayName: Queue downstream mirror pipeline
    env:
      SUBMODULE_TARGET: ${{ variables.submoduleTarget }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
