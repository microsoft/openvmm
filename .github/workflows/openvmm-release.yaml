name: OpenVMM Release
on:
  workflow_dispatch:
    inputs:
      verbose:
        description: Run with verbose output
        default: false
        required: false
        type: boolean
  push:
    tags:
    - openvmm-v*
jobs:
  job0:
    name: build openvmm [distribution config, x64-linux-gnu]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.event.pull_request.draft == false
    steps:
    - run: |
        set -x
        i=0; while [ $i -lt 5 ] && ! sudo apt-get update; do let "i=i+1"; sleep 1; done;
        sudo apt-get -o DPkg::Lock::Timeout=60 install gcc -y
        curl --fail --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain=1.95.0 -y
        . "$HOME/.cargo/env"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup show
      if: runner.os == 'Linux'
      name: rustup (Linux)
      shell: bash
    - run: |
        set -x
        curl --fail -sSfLo rustup-init.exe https://win.rustup.rs/x86_64 --output rustup-init
        ./rustup-init.exe -y --default-toolchain=1.95.0
        echo "$USERPROFILE\\.cargo\\bin" >> $GITHUB_PATH
      if: runner.os == 'Windows' && runner.arch == 'X64'
      name: rustup (Windows X64)
      shell: bash
    - run: |
        set -x
        curl --fail -sSfLo rustup-init.exe https://win.rustup.rs/aarch64 --output rustup-init
        ./rustup-init.exe -y --default-toolchain=1.95.0
        echo "$USERPROFILE\\.cargo\\bin" >> $GITHUB_PATH
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      name: rustup (Windows ARM64)
      shell: bash
    - uses: actions/checkout@v6
      with:
        path: flowey_bootstrap
    - name: Build flowey
      run: |
        set -x
        CARGO_INCREMENTAL=0 cargo build -p flowey_hvlite --target x86_64-unknown-linux-gnu --profile flowey-ci
        OutDirNormal=$(echo "${{ runner.temp }}/bootstrapped-flowey" | sed -e 's|\\|\/|g' -e 's|^\([A-Za-z]\)\:/\(.*\)|/\L\1\E/\2|')
        mkdir -p "$OutDirNormal"
        mv ./.github/workflows/openvmm-release.yaml "$OutDirNormal/pipeline.yaml"
        mv target/x86_64-unknown-linux-gnu/flowey-ci/flowey_hvlite "$OutDirNormal/flowey"
      working-directory: flowey_bootstrap
      shell: bash
    - run: echo "${{ runner.temp }}/bootstrapped-flowey" >> $GITHUB_PATH
      shell: bash
      name: 🌼📦 Add flowey to PATH
    - name: 🌼🔎 Self-check YAML
      run: |-
        ESCAPED_AGENT_TEMPDIR=$(
        cat <<'EOF' | sed 's/\\/\\\\/g'
        ${{ runner.temp }}
        EOF
        )
        flowey pipeline github --runtime $ESCAPED_AGENT_TEMPDIR/bootstrapped-flowey/pipeline.yaml --out .github/workflows/openvmm-release.yaml ci release-openvmm
      shell: bash
    - name: 🌼🛫 Initialize job
      run: |
        AgentTempDirNormal="${{ runner.temp }}"
        AgentTempDirNormal=$(echo "$AgentTempDirNormal" | sed -e 's|\\|\/|g' -e 's|^\([A-Za-z]\)\:/\(.*\)|/\L\1\E/\2|')
        echo "AgentTempDirNormal=$AgentTempDirNormal" >> $GITHUB_ENV

        chmod +x $AgentTempDirNormal/bootstrapped-flowey/flowey

        echo '"debug"' | flowey v 0 'FLOWEY_LOG' update
        echo "${{ runner.temp }}/work" | flowey v 0 '_internal_WORKING_DIR' --is-raw-string update

        cat <<'EOF' | flowey v 0 'verbose' update
        ${{ inputs.verbose != '' && inputs.verbose || 'false' }}
        EOF
      shell: bash
    - name: add default cargo home to path
      run: flowey e 0 flowey_lib_common::install_rust 0
      shell: bash
    - name: install Rust
      run: flowey e 0 flowey_lib_common::install_rust 1
      shell: bash
    - name: checking if packages need to be installed
      run: flowey e 0 flowey_lib_common::install_dist_pkg 0
      shell: bash
    - name: installing packages
      run: flowey e 0 flowey_lib_common::install_dist_pkg 1
      shell: bash
    - name: check if openvmm needs to be cloned
      run: |-
        flowey e 0 flowey_lib_common::git_checkout 0
        flowey v 0 'flowey_lib_common::git_checkout:0:flowey_lib_common/src/git_checkout.rs' --is-raw-string --condvar flowey_lib_common::git_checkout:1:flowey_lib_common/src/git_checkout.rs write-to-env github floweyvar1
        flowey v 0 'flowey_lib_common::git_checkout:1:flowey_lib_common/src/git_checkout.rs' write-to-env github FLOWEY_CONDITION
      shell: bash
    - id: flowey_lib_common__git_checkout__1
      uses: actions/checkout@v6
      with:
        fetch-depth: '1'
        path: repo0
        persist-credentials: ${{ env.floweyvar1 }}
      name: checkout repo openvmm
      if: ${{ fromJSON(env.FLOWEY_CONDITION) }}
    - name: report cloned repo directories
      run: |-
        flowey v 0 'flowey_lib_common::git_checkout:4:flowey_core/src/node/github_context.rs' --is-raw-string update --env-source github.workspace <<EOF
        ${{ github.workspace }}
        EOF
        flowey e 0 flowey_lib_common::git_checkout 3
      shell: bash
    - name: print system info
      run: |-
        flowey e 0 flowey_lib_common::system_info 0
        flowey e 0 flowey_lib_hvlite::git_checkout_openvmm_repo 0
      shell: bash
    - name: resolve source release identity
      run: |-
        flowey e 0 flowey_lib_hvlite::_jobs::check_distro_build 0
        flowey e 0 flowey_lib_hvlite::_jobs::check_distro_build 1
        flowey e 0 flowey_lib_hvlite::_jobs::check_distro_build 2
      shell: bash
    - name: assemble OpenVMM source release
      run: |-
        flowey e 0 flowey_lib_hvlite::assemble_openvmm_source_release 0
        flowey e 0 flowey_lib_hvlite::_jobs::check_distro_build 3
      shell: bash
    - name: build openvmm in a distribution configuration
      run: flowey e 0 flowey_lib_hvlite::_jobs::check_distro_build 4
      shell: bash
    - name: 🌼🧼 Redact bootstrap var db
      run: rm $AgentTempDirNormal/bootstrapped-flowey/job0.json
      shell: bash
    - name: 🌼🥾 Publish bootstrapped flowey
      uses: actions/upload-artifact@v7
      with:
        name: _internal-flowey-bootstrap-x86_64-linux-uid-1
        path: ${{ runner.temp }}/bootstrapped-flowey
  job1:
    name: publish OpenVMM release
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    needs:
    - job0
    if: github.event.pull_request.draft == false
    steps:
    - name: 🌼📦 Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: _internal-flowey-bootstrap-x86_64-linux-uid-1
        path: ${{ runner.temp }}/used_artifacts/_internal-flowey-bootstrap-x86_64-linux-uid-1/
    - run: echo "${{ runner.temp }}/used_artifacts/_internal-flowey-bootstrap-x86_64-linux-uid-1" >> $GITHUB_PATH
      shell: bash
      name: 🌼📦 Add flowey to PATH
    - name: 🌼🛫 Initialize job
      run: |
        AgentTempDirNormal="${{ runner.temp }}"
        AgentTempDirNormal=$(echo "$AgentTempDirNormal" | sed -e 's|\\|\/|g' -e 's|^\([A-Za-z]\)\:/\(.*\)|/\L\1\E/\2|')
        echo "AgentTempDirNormal=$AgentTempDirNormal" >> $GITHUB_ENV

        chmod +x $AgentTempDirNormal/used_artifacts/_internal-flowey-bootstrap-x86_64-linux-uid-1/flowey

        echo '"debug"' | flowey v 1 'FLOWEY_LOG' update
        echo "${{ runner.temp }}/work" | flowey v 1 '_internal_WORKING_DIR' --is-raw-string update

        cat <<'EOF' | flowey v 1 'verbose' update
        ${{ inputs.verbose != '' && inputs.verbose || 'false' }}
        EOF
      shell: bash
    - name: create gh cache dir
      run: flowey e 1 flowey_lib_common::download_gh_cli 0
      shell: bash
    - name: Pre-processing cache vars
      run: |-
        flowey e 1 flowey_lib_common::cache 0
        flowey v 1 'flowey_lib_common::cache:2:flowey_lib_common/src/cache.rs' --is-raw-string write-to-env github floweyvar3
        flowey v 1 'flowey_lib_common::cache:1:flowey_lib_common/src/cache.rs' --is-raw-string write-to-env github floweyvar4
      shell: bash
    - id: flowey_lib_common__cache__1
      uses: actions/cache@v5
      with:
        key: ${{ env.floweyvar3 }}
        path: ${{ env.floweyvar4 }}
      name: 'Restore cache: gh-cli'
    - name: installing gh
      run: |-
        flowey v 1 'flowey_lib_common::cache:4:flowey_lib_common/src/cache.rs' --is-raw-string update --env-source steps.flowey_lib_common__cache__1.outputs.cache-hit <<EOF
        ${{ steps.flowey_lib_common__cache__1.outputs.cache-hit }}
        EOF
        flowey e 1 flowey_lib_common::cache 2
        flowey e 1 flowey_lib_common::download_gh_cli 1
        flowey v 1 'flowey_lib_hvlite::_jobs::cfg_common:0:flowey_core/src/node/github_context.rs' --is-raw-string update --env-source github.token <<EOF
        ${{ github.token }}
        EOF
      shell: bash
    - name: setup gh cli
      run: flowey e 1 flowey_lib_common::use_gh_cli 0
      shell: bash
    - name: check if openvmm needs to be cloned
      run: |-
        flowey e 1 flowey_lib_common::git_checkout 0
        flowey v 1 'flowey_lib_common::git_checkout:0:flowey_lib_common/src/git_checkout.rs' --is-raw-string --condvar flowey_lib_common::git_checkout:1:flowey_lib_common/src/git_checkout.rs write-to-env github floweyvar2
        flowey v 1 'flowey_lib_common::git_checkout:1:flowey_lib_common/src/git_checkout.rs' write-to-env github FLOWEY_CONDITION
      shell: bash
    - id: flowey_lib_common__git_checkout__1
      uses: actions/checkout@v6
      with:
        fetch-depth: '1'
        path: repo0
        persist-credentials: ${{ env.floweyvar2 }}
      name: checkout repo openvmm
      if: ${{ fromJSON(env.FLOWEY_CONDITION) }}
    - name: report cloned repo directories
      run: |-
        flowey v 1 'flowey_lib_common::git_checkout:4:flowey_core/src/node/github_context.rs' --is-raw-string update --env-source github.workspace <<EOF
        ${{ github.workspace }}
        EOF
        flowey e 1 flowey_lib_common::git_checkout 3
      shell: bash
    - name: print system info
      run: |-
        flowey e 1 flowey_lib_common::system_info 0
        flowey e 1 flowey_lib_hvlite::git_checkout_openvmm_repo 0
      shell: bash
    - name: resolve OpenVMM release identity
      run: |-
        flowey e 1 flowey_lib_hvlite::_jobs::publish_openvmm_gh_release 0
        flowey e 1 flowey_lib_hvlite::_jobs::publish_openvmm_gh_release 1
        flowey e 1 flowey_lib_hvlite::_jobs::publish_openvmm_gh_release 2
      shell: bash
    - name: assemble OpenVMM source release
      run: |-
        flowey e 1 flowey_lib_hvlite::assemble_openvmm_source_release 0
        flowey e 1 flowey_lib_hvlite::_jobs::publish_openvmm_gh_release 3
        flowey e 1 flowey_lib_hvlite::_jobs::publish_openvmm_gh_release 4
        flowey e 1 flowey_lib_hvlite::_jobs::publish_openvmm_gh_release 5
        flowey e 1 flowey_lib_hvlite::_jobs::publish_openvmm_gh_release 6
        flowey e 1 flowey_lib_hvlite::_jobs::publish_openvmm_gh_release 7
        flowey e 1 flowey_lib_hvlite::_jobs::publish_openvmm_gh_release 8
        flowey e 1 flowey_lib_common::attest_build_provenance 0
        flowey v 1 'flowey_lib_common::attest_build_provenance:0:flowey_lib_common/src/attest_build_provenance.rs' --is-raw-string write-to-env github floweyvar1
      shell: bash
    - id: flowey_lib_common__attest_build_provenance__1
      uses: actions/attest@v4
      with:
        subject-path: ${{ env.floweyvar1 }}
      name: Attest release artifacts
    - name: publish github releases
      run: flowey e 1 flowey_lib_common::publish_gh_release 0
      shell: bash
    - name: 'validate cache entry: gh-cli'
      run: flowey e 1 flowey_lib_common::cache 3
      shell: bash
