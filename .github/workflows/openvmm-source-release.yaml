    - name: add default cargo home to path
      run: flowey e 1 flowey_lib_common::install_rust 0
    - name: install Rust
      run: flowey e 1 flowey_lib_common::install_rust 1
    - name: detect active toolchain
      run: flowey e 1 flowey_lib_common::install_rust 2
    - name: checking if packages need to be installed
      run: flowey e 1 flowey_lib_common::install_dist_pkg 0
    - name: installing packages
      run: flowey e 1 flowey_lib_common::install_dist_pkg 1
    - name: build openvmm in a distribution configuration
      run: flowey e 1 flowey_lib_hvlite::_jobs::check_distro_build 0
  job2:
    name: draft openvmm source release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
    - job0
    - job1
    if: github.event.pull_request.draft == false
