name: OpenVMM Source Release
on:
  workflow_dispatch:
    inputs:
      verbose:
        description: Run with verbose output
        default: false
        required: false
        type: boolean
jobs:
  job0:
    name: assemble openvmm vendor artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    defaults:
      run:
        shell: bash
    steps:
    - run: |
        set -x
        i=0; while [ $i -lt 5 ] && ! sudo apt-get update; do let "i=i+1"; sleep 1; done;
        sudo apt-get -o DPkg::Lock::Timeout=60 install gcc -y
        curl --fail --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain=1.95.0 -y
        . "$HOME/.cargo/env"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup show
      if: runner.os == 'Linux'
      name: rustup (Linux)
    - run: |
        set -x
        curl --fail -sSfLo rustup-init.exe https://win.rustup.rs/x86_64
        ./rustup-init.exe -y --default-toolchain=1.95.0
        echo "$USERPROFILE\\.cargo\\bin" >> $GITHUB_PATH
      if: runner.os == 'Windows' && runner.arch == 'X64'
      name: rustup (Windows X64)
    - run: |
        set -x
        curl --fail -sSfLo rustup-init.exe https://win.rustup.rs/aarch64
        ./rustup-init.exe -y --default-toolchain=1.95.0
        echo "$USERPROFILE\\.cargo\\bin" >> $GITHUB_PATH
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      name: rustup (Windows ARM64)
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        path: flowey_bootstrap
    - name: Build flowey
      run: |
        set -x
        CARGO_INCREMENTAL=0 cargo build -p flowey_hvlite --target x86_64-unknown-linux-gnu --profile flowey-ci
        OutDirNormal=$(echo "${{ runner.temp }}/bootstrapped-flowey" | sed -e 's|\\|\/|g' -e 's|^\([A-Za-z]\)\:/\(.*\)|/\L\1\E/\2|')
        mkdir -p "$OutDirNormal"
        mv ./.github/workflows/openvmm-source-release.yaml "$OutDirNormal/pipeline.yaml"
        mv target/x86_64-unknown-linux-gnu/flowey-ci/flowey_hvlite "$OutDirNormal/flowey"
      working-directory: flowey_bootstrap
    - run: echo "${{ runner.temp }}/bootstrapped-flowey" >> $GITHUB_PATH
      name: 🌼📦 Add flowey to PATH
    - name: 🌼🔎 Self-check YAML
      run: |-
        ESCAPED_AGENT_TEMPDIR=$(
        cat <<'EOF' | sed 's/\\/\\\\/g'
        ${{ runner.temp }}
        EOF
        )
        flowey pipeline github --runtime $ESCAPED_AGENT_TEMPDIR/bootstrapped-flowey/pipeline.yaml --out .github/workflows/openvmm-source-release.yaml ci openvmm-source-release
    - name: 🌼🛫 Initialize job
      run: |
        AgentTempDirNormal="${{ runner.temp }}"
        AgentTempDirNormal=$(echo "$AgentTempDirNormal" | sed -e 's|\\|\/|g' -e 's|^\([A-Za-z]\)\:/\(.*\)|/\L\1\E/\2|')
        echo "AgentTempDirNormal=$AgentTempDirNormal" >> $GITHUB_ENV

        chmod +x $AgentTempDirNormal/bootstrapped-flowey/flowey

        echo '"debug"' | flowey v 0 '@0' update
        echo "${{ runner.temp }}/work" | flowey v 0 '@1' --is-raw-string update

        cat <<'EOF' | flowey v 0 '@6' update
        ${{ inputs.verbose != '' && inputs.verbose || 'false' }}
        EOF
        mkdir -p "$AgentTempDirNormal/publish_artifacts/openvmm-vendor-release"
        echo "$AgentTempDirNormal/publish_artifacts/openvmm-vendor-release" | flowey v 0 '@2' --is-raw-string update
    - name: check if openvmm needs to be cloned
      run: |-
        flowey e 0 @9 0
        flowey v 0 '@3' --is-raw-string --condvar @4 write-to-env github fv1
        flowey v 0 '@4' write-to-env github FLOWEY_CONDITION
    - id: s1
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: '1'
        path: repo0
        persist-credentials: ${{ env.fv1 }}
      name: checkout repo openvmm
      if: ${{ fromJSON(env.FLOWEY_CONDITION) }}
    - name: report cloned repo directories
      run: |-
        flowey v 0 '@5' --is-raw-string update --env-source github.workspace <<EOF
        ${{ github.workspace }}
        EOF
        flowey e 0 @9 3
    - name: print system info
      run: flowey e 0 @16 0 @24 0
    - name: add default cargo home to path
      run: flowey e 0 @14 0
    - name: install Rust
      run: flowey e 0 @14 1
    - name: detect active toolchain
      run: flowey e 0 @14 2
    - name: assemble OpenVMM vendor archive
      run: flowey e 0 @21 0 @0 0
    - name: 🌼📦 Publish openvmm-vendor-release
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: openvmm-vendor-release
        path: ${{ runner.temp }}/publish_artifacts/openvmm-vendor-release/
        include-hidden-files: true
    - name: 🌼🧼 Redact bootstrap var db
      run: rm $AgentTempDirNormal/bootstrapped-flowey/job0.json
    - name: 🌼🥾 Publish bootstrapped flowey
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: _internal-flowey-bootstrap-x86_64-linux-uid-1
        path: ${{ runner.temp }}/bootstrapped-flowey
  job1:
    name: validate openvmm distribution build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
    - job0
    if: github.event.pull_request.draft == false
    defaults:
      run:
        shell: bash
    steps:
    - name: 🌼📦 Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: '{_internal-flowey-bootstrap-x86_64-linux-uid-1,openvmm-vendor-release}'
        path: ${{ runner.temp }}/used_artifacts/
    - run: echo "${{ runner.temp }}/used_artifacts/_internal-flowey-bootstrap-x86_64-linux-uid-1" >> $GITHUB_PATH
      name: 🌼📦 Add flowey to PATH
    - name: 🌼🛫 Initialize job
      run: |
        AgentTempDirNormal="${{ runner.temp }}"
        AgentTempDirNormal=$(echo "$AgentTempDirNormal" | sed -e 's|\\|\/|g' -e 's|^\([A-Za-z]\)\:/\(.*\)|/\L\1\E/\2|')
        echo "AgentTempDirNormal=$AgentTempDirNormal" >> $GITHUB_ENV

        chmod +x $AgentTempDirNormal/used_artifacts/_internal-flowey-bootstrap-x86_64-linux-uid-1/flowey

        echo '"debug"' | flowey v 1 '@0' update
        echo "${{ runner.temp }}/work" | flowey v 1 '@1' --is-raw-string update

        cat <<'EOF' | flowey v 1 '@6' update
        ${{ inputs.verbose != '' && inputs.verbose || 'false' }}
        EOF
        echo "$AgentTempDirNormal/used_artifacts/openvmm-vendor-release" | flowey v 1 '@2' --is-raw-string update
    - name: check if openvmm needs to be cloned
      run: |-
        flowey e 1 @0 0 @9 0
        flowey v 1 '@3' --is-raw-string --condvar @4 write-to-env github fv1
        flowey v 1 '@4' write-to-env github FLOWEY_CONDITION
    - id: s1
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: '1'
        path: repo0
        persist-credentials: ${{ env.fv1 }}
      name: checkout repo openvmm
      if: ${{ fromJSON(env.FLOWEY_CONDITION) }}
    - name: report cloned repo directories
      run: |-
        flowey v 1 '@5' --is-raw-string update --env-source github.workspace <<EOF
        ${{ github.workspace }}
        EOF
        flowey e 1 @9 3
    - name: print system info
      run: flowey e 1 @17 0 @25 0
    - name: add default cargo home to path
      run: flowey e 1 @15 0
    - name: install Rust
      run: flowey e 1 @15 1
    - name: detect active toolchain
      run: flowey e 1 @15 2
    - name: checking if packages need to be installed
      run: flowey e 1 @12 0
    - name: installing packages
      run: flowey e 1 @12 1
    - name: build openvmm in a distribution configuration
      run: flowey e 1 @22 0
  job2:
    name: draft openvmm source release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
    - job0
    - job1
    if: github.event.pull_request.draft == false
    defaults:
      run:
        shell: bash
    steps:
    - name: 🌼📦 Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: '{_internal-flowey-bootstrap-x86_64-linux-uid-1,openvmm-vendor-release}'
        path: ${{ runner.temp }}/used_artifacts/
    - run: echo "${{ runner.temp }}/used_artifacts/_internal-flowey-bootstrap-x86_64-linux-uid-1" >> $GITHUB_PATH
      name: 🌼📦 Add flowey to PATH
    - name: 🌼🛫 Initialize job
      run: |
        AgentTempDirNormal="${{ runner.temp }}"
        AgentTempDirNormal=$(echo "$AgentTempDirNormal" | sed -e 's|\\|\/|g' -e 's|^\([A-Za-z]\)\:/\(.*\)|/\L\1\E/\2|')
        echo "AgentTempDirNormal=$AgentTempDirNormal" >> $GITHUB_ENV

        chmod +x $AgentTempDirNormal/used_artifacts/_internal-flowey-bootstrap-x86_64-linux-uid-1/flowey

        echo '"debug"' | flowey v 2 '@0' update
        echo "${{ runner.temp }}/work" | flowey v 2 '@1' --is-raw-string update

        cat <<'EOF' | flowey v 2 '@7' update
        ${{ inputs.verbose != '' && inputs.verbose || 'false' }}
        EOF
        echo "$AgentTempDirNormal/used_artifacts/openvmm-vendor-release" | flowey v 2 '@2' --is-raw-string update
    - name: resolve source release identity
      run: flowey e 2 @0 0 @22 1 @22 3
    - name: create gh cache dir
      run: flowey e 2 @6 0
    - name: Pre-processing cache vars
      run: |-
        flowey e 2 @1 0
        flowey v 2 '@4' --is-raw-string write-to-env github fv1
        flowey v 2 '@3' --is-raw-string write-to-env github fv2
    - id: s1
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        key: ${{ env.fv1 }}
        path: ${{ env.fv2 }}
      name: 'Restore cache: gh-cli'
    - name: installing gh
      run: |-
        flowey v 2 '@5' --is-raw-string update --env-source steps.s1.outputs.cache-hit <<EOF
        ${{ steps.s1.outputs.cache-hit }}
        EOF
        flowey e 2 @1 2 @6 1
        flowey v 2 '@6' --is-raw-string update --env-source github.token <<EOF
        ${{ github.token }}
        EOF
    - name: setup gh cli
      run: flowey e 2 @18 0
    - name: ensure no existing source release
      run: flowey e 2 @22 5
    - name: enumerate release files
      run: flowey e 2 @22 0 @22 2
    - name: pin source release tag
      run: flowey e 2 @22 6 @22 4
    - name: publish github releases
      run: flowey e 2 @16 0
    - name: 'validate cache entry: gh-cli'
      run: flowey e 2 @1 3
