        path: ${{ runner.temp }}/used_artifacts/_internal-flowey-bootstrap-x86_64-linux-uid-1/
    - run: echo "${{ runner.temp }}/used_artifacts/_internal-flowey-bootstrap-x86_64-linux-uid-1" >> $GITHUB_PATH
      name: 🌼📦 Add flowey to PATH
    - name: 🌼🛫 Initialize job
      run: |
        AgentTempDirNormal="${{ runner.temp }}"
        AgentTempDirNormal=$(echo "$AgentTempDirNormal" | sed -e 's|\\|\/|g' -e 's|^\([A-Za-z]\)\:/\(.*\)|/\L\1\E/\2|')
        echo "AgentTempDirNormal=$AgentTempDirNormal" >> $GITHUB_ENV

        chmod +x $AgentTempDirNormal/used_artifacts/_internal-flowey-bootstrap-x86_64-linux-uid-1/flowey

        echo '"debug"' | flowey v 9 '@0' update
        echo "${{ runner.temp }}/work" | flowey v 9 '@1' --is-raw-string update

        cat <<'EOF' | flowey v 9 '@25' update
        ${{ inputs.verbose != '' && inputs.verbose || 'false' }}
        EOF
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-igvmfilegen"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-igvmfilegen" | flowey v 9 '@2' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-musl-openvmm"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-musl-openvmm" | flowey v 9 '@3' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-musl-openvmm_vhost"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-musl-openvmm_vhost" | flowey v 9 '@4' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-musl-prep_steps"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-musl-prep_steps" | flowey v 9 '@5' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-musl-vmm-perf-runner"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-musl-vmm-perf-runner" | flowey v 9 '@6' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-musl-vmm-tests-archive"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-musl-vmm-tests-archive" | flowey v 9 '@7' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-ohcldiag-dev"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-ohcldiag-dev" | flowey v 9 '@8' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-openvmm"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-openvmm" | flowey v 9 '@9' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-openvmm_vhost"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-openvmm_vhost" | flowey v 9 '@10' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-vmgs_lib"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-vmgs_lib" | flowey v 9 '@11' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-vmgstool"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-vmgstool" | flowey v 9 '@12' --is-raw-string update
