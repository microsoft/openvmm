name: '[Optional] OpenVMM Release PR'
on:
  workflow_dispatch:
    inputs:
      verbose:
        description: Run with verbose output
        default: false
        required: false
        type: boolean
  pull_request:
    branches:
    - main
    - release/*
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - labeled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
