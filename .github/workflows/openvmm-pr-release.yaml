        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-vmgstool-dev" | flowey v 9 '@13' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-vmm-perf-runner"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-vmm-perf-runner" | flowey v 9 '@14' --is-raw-string update
        mkdir -p "$AgentTempDirNormal/publish_artifacts/aarch64-linux-vmm-tests-archive"
        echo "$AgentTempDirNormal/publish_artifacts/aarch64-linux-vmm-tests-archive" | flowey v 9 '@15' --is-raw-string update
    - name: add default cargo home to path
