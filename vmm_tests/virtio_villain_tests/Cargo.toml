[package]
name = "virtio_villain_tests"
edition.workspace = true
rust-version.workspace = true

[[test]]
name = "villain"
# Custom libtest-mimic harness: one trial is generated per villain test, so
# `cargo nextest run -p virtio_villain_tests` discovers and runs each villain
# test in its own process. Requires the villain image/TSV (see tests/villain.rs).
harness = false

[dependencies]
petri.workspace = true
petri_artifacts_common.workspace = true
petri_artifacts_core.workspace = true
petri_artifacts_vmm_test.workspace = true
petri_artifact_resolver_openvmm_known_paths.workspace = true
openvmm_defs.workspace = true
virtio_resources.workspace = true
disk_backend_resources.workspace = true
net_backend_resources.workspace = true
serial_core.workspace = true
vm_resource.workspace = true
pal_async.workspace = true

anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
fs-err.workspace = true
libtest-mimic.workspace = true
tempfile.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
unix_socket.workspace = true

[lints]
workspace = true
