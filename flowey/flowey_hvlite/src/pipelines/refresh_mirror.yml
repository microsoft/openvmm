# On backport, set this pair to the release branch and its downstream target, then run `cargo xflowey regen`.
variables:
  mirrorBranch: &mirrorBranch main
  submoduleTarget: main

trigger:
  batch: true
  branches:
    include:
    - *mirrorBranch
pr: none
pool:
  vmImage: ubuntu-latest
jobs:
- job: QueueMirror
  condition: and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables['Build.Repository.Name'], 'microsoft/openvmm'))
  steps:
  - checkout: none
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      if ($env:BUILD_SOURCEBRANCH -cne "refs/heads/$env:MIRROR_BRANCH") {
          throw "Unexpected source ref: $env:BUILD_SOURCEBRANCH"
      }
      $body = @{
          templateParameters = @{
              branchToMirror = $env:MIRROR_BRANCH
              branchToUpdateSubmodule = $env:SUBMODULE_TARGET
              updateSubmodule = $true
          }
      } | ConvertTo-Json

      $run = Invoke-RestMethod -Method Post `
          -Uri 'https://dev.azure.com/microsoft/HyperVCloud/_apis/pipelines/149443/runs?api-version=7.1' `
          -Headers @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" } `
          -MaximumRedirection 0 -ContentType 'application/json' -Body $body
      Write-Host "Queued mirror refresh $($run.id) for $env:MIRROR_BRANCH"
    displayName: Queue mirror refresh
    env:
      MIRROR_BRANCH: ${{ variables.mirrorBranch }}
      SUBMODULE_TARGET: ${{ variables.submoduleTarget }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
