syntax = 'proto3';

package vmservice;
option go_package = "vmservice";

import "google/protobuf/empty.proto";

import "vmservice.disk.proto";
import "vmservice.nic.proto";
import "vmservice.numa.proto";
import "vmservice.nvme.proto";
import "vmservice.pci.proto";
import "vmservice.virtio.proto";
import "vmservice.vfio.proto";

service VM {
    // VM lifecycle & management

    // CreateVm will create the virtual machine with the configuration in the
    // CreateVmRequest. The virtual machine will be in a paused state, power wise,
    // after CreateVm. ResumeVm can be called to transition the VM into a running
    // state.
    rpc CreateVm(CreateVmRequest) returns (google.protobuf.Empty);

    // TeardownVm will release all associated resources from the VM and unblock
    // the WaitVm call.
    rpc TeardownVm(google.protobuf.Empty) returns (google.protobuf.Empty);

    // PauseVm will, if the virtual machine power state is in a running state,
    // transition the state to paused. This is the same state, power wise, that
    // the VM should be in after an initial Create call.
    rpc PauseVm(google.protobuf.Empty) returns (google.protobuf.Empty);

    // ResumeVm is used to transition a VM to a running state.
    // This can be used to resume a VM that has had PauseVm called on it,
    // or to start a VM that was created with Create.
    rpc ResumeVm(google.protobuf.Empty) returns (google.protobuf.Empty);

    // WaitVm will block until the VM is either in a halted state or has had all
    // of its resources freed via TeardownVm.
    rpc WaitVm(google.protobuf.Empty) returns (google.protobuf.Empty);

    // VmProperties will take in a list of properties that the virtstack will
    // return statistics for (memory, processors).
    rpc VmProperties(VmPropertiesRequest) returns (VmPropertiesResponse);

    // ModifyVmResource is a generic call to modify (add/remove/update) resources
    // for a VM. This includes things such as block devices, network adapters, and
    // pci devices.
    rpc ModifyVmResource(ModifyVmResourceRequest) returns (google.protobuf.Empty);

    // AddVmPcieDevice hot-adds a PCIe device behind a named port (a root port or
    // switch downstream port declared in the topology).
    rpc AddVmPcieDevice(AddVmPcieDeviceRequest) returns (google.protobuf.Empty);

    // RemoveVmPcieDevice hot-removes the PCIe device behind the named port.
    rpc RemoveVmPcieDevice(RemoveVmPcieDeviceRequest) returns (google.protobuf.Empty);

    // AddVmVpciDevice hot-adds a PCI device over the Hyper-V VPCI transport.
    rpc AddVmVpciDevice(AddVmVpciDeviceRequest) returns (google.protobuf.Empty);

    // RemoveVmVpciDevice hot-removes a dynamically added VPCI device.
    // Removing an unknown or previously removed instance ID returns an error.
    rpc RemoveVmVpciDevice(RemoveVmVpciDeviceRequest) returns (google.protobuf.Empty);

    // Service management

    // Capabilities will return what capabilities the virtstack supports.
    // This includes what guest operating systems and resources are supported,
    // if hot add/hot remove of a resource is supported.
    rpc Capabilities(google.protobuf.Empty) returns (CapabilitiesResponse);

    // Quit will shutdown the process hosting the VM management server.
    rpc Quit(google.protobuf.Empty) returns (google.protobuf.Empty);
}

// Note: VTL assignment is not modeled yet; all devices are assumed to be VTL0.

//
// VM lifecycle request/response
//

message DirectBoot {
    string kernel_path    = 1;
    string initrd_path    = 2;
    string kernel_cmdline = 3;
}

message Uefi {
    // Variables used to initialize an empty UEFI variable store. These are
    // ignored when the store already contains any variables.
    message InitialVariables {
        // A predefined set of Secure Boot-related variables. Selecting a
        // template initializes keys and signature databases but does not
        // enable Secure Boot enforcement.
        enum SecureBootTemplate {
            SECURE_BOOT_TEMPLATE_UNSPECIFIED = 0;
            // Do not initialize Secure Boot-related variables from a template.
            SECURE_BOOT_TEMPLATE_NONE = 1;
            // Initialize variables with the Microsoft Windows certificate set.
            SECURE_BOOT_TEMPLATE_MICROSOFT_WINDOWS = 2;
            // Initialize variables with the Microsoft UEFI CA certificate set.
            SECURE_BOOT_TEMPLATE_MICROSOFT_UEFI_CERTIFICATE_AUTHORITY = 3;
        }

        // The predefined Secure Boot variable set to use for initialization.
        SecureBootTemplate secure_boot_template = 1;
    }

    // Path to the UEFI firmware image on the host.
    string firmware_path = 1;

    // Fields 2 and 3 were previously `device_path` and `optional_data`. They
    // had no OpenVMM equivalent and were never honored.
    reserved 2, 3;
    reserved "device_path", "optional_data";

    // Variables to inject when initializing an empty UEFI variable store.
    optional InitialVariables initial_variables = 4;

    // Whether the firmware enforces Secure Boot policy. This is independent
    // of whether initial Secure Boot variables are supplied above.
    bool secure_boot_enabled = 5;
}

message MemoryConfig {
    uint64 memory_mb            = 1;
    bool allow_overcommit       = 2;
    bool deferred_commit        = 3;
    bool hot_hint               = 4;
    bool cold_hint              = 5;
    bool cold_discard_hint      = 6;
    uint64 low_mmio_gap_in_mb   = 7;
    uint64 high_mmio_base_in_mb = 8;
    uint64 high_mmio_gap_in_mb  = 9;
}

message ProcessorConfig {
    uint32 processor_count  = 1;
    uint32 processor_weight = 2;
    uint32 processor_limit  = 3;

    // Optional arch specific topology overrides.
    oneof arch_config {
        ProcessorX86Config x86         = 4;
        ProcessorAarch64Config aarch64 = 5;
    }
}

// Reflects the overrides of the `X86TopologyConfig`.
message ProcessorX86Config {
}

// Reflects the overrides of the `Aarch64TopologyConfig`.
message ProcessorAarch64Config {
    // MSI controller selection for aarch64 PCIe interrupt delivery.
    //
    // Optional.
    //
    // If left unset, automatically select the best available MSI controller:
    // - `GicMsiItsConfig` when the hypervisor supports it,
    // - otherwise `GicMsiV2mConfig`.
    oneof gic_msi_config {
        // Force GICv3 ITS for MSI delivery via LPIs.
        GicMsiItsConfig msi_its = 5;
        // Force GICv2m for MSI delivery via SPIs.
        GicMsiV2mConfig msi_v2m = 6;
    }
}

// GICv3-specific MSI delivery overrides.
message GicMsiItsConfig {
}

// GICv2m-specific MSI delivery overrides.
message GicMsiV2mConfig {
    // Number of SPIs reserved for PCIe MSIs.
    //
    // Optional.
    //
    // When unset, will use a platform-specific default.
    optional uint32 spi_count = 1;
}

message DevicesConfig {
    repeated ScsiDisk scsi_disks   = 1;
    repeated VpmemDisk vpmem_disks = 2;
    repeated NicConfig nic_config  = 3;
    // When we know what information we need to assign a pci device on Linux,
    // have a oneof here named PCIDevice with WindowsPCIDevice and LinuxPCIDevice
    // housed.
    repeated WindowsPciDevice windows_device = 4;
    repeated VirtioFs virtiofs_config        = 5;
    VirtioConsoleConfig virtio_console       = 6;
}

message VmConfig {
    // Action for the VMM to take when the guest triggers a power event.
    enum GuestPowerAction {
        GUEST_POWER_ACTION_UNSPECIFIED = 0;
        // Use the default for this event.
        GUEST_POWER_ACTION_DEFAULT = 1;
        // Restart the guest.
        GUEST_POWER_ACTION_RESTART = 2;
        // Leave the virtual machine halted.
        GUEST_POWER_ACTION_HALT = 3;
    }

    // Actions for the VMM to take on guest power events.
    message GuestPowerActions {
        // The guest powered off or hibernated. Defaults to HALT.
        optional GuestPowerAction shutdown = 1;
        // The guest requested a reset. Defaults to RESTART.
        optional GuestPowerAction reset = 2;
        // The guest triple faulted. Defaults to HALT.
        optional GuestPowerAction crash = 3;
        // The guest's watchdog timer expired. Defaults to RESTART.
        optional GuestPowerAction watchdog = 4;
    }

    MemoryConfig memory_config       = 1;
    ProcessorConfig processor_config = 2;
    DevicesConfig devices_config     = 3;
    SerialConfig serial_config       = 4;
    oneof BootConfig {
        DirectBoot direct_boot = 5;
        Uefi uefi              = 6;
    }
    WindowsOptions windows_options = 7;
    // Field 8 was previously map<string, string> extra_data.
    reserved 8;
    reserved "extra_data";
    HvSocketConfig hvsocket_config = 9;

    // Virtual NUMA topology. Mutually exclusive with memory_config
    // (mirrors the CLI --memory vs --numa conflict).
    NumaConfig numa_config = 10;
    // PCIe root complexes / ports / switches.
    PcieTopologyConfig pcie = 11;
    // Actions to take on guest power events. Each unset action uses its
    // default.
    optional GuestPowerActions guest_power_actions = 12;

    // SMBIOS (DMI) identity overrides. Applied to whichever boot type is
    // selected; note that PCAT boot honors only the system UUID and serial
    // number.
    SmbiosConfig smbios_config = 13;

    optional string crash_dump_path = 14;
    // Host iommufd contexts to create with the VM. Linux only; a non-empty
    // list on other hosts is an error. Contexts remain available until VM
    // teardown, including when unused or after their last device is removed,
    // so AddVmPcieDevice can reference them. No runtime context add/remove.
    repeated IommufdConfig iommufds = 15;
    // Run without VMBus. Incompatible with VMBus devices and HVSocket.
    bool disable_vmbus = 16;
    // Do not expose Hyper-V (HV#1) enlightenments. Requires disable_vmbus.
    // Unsupported for x86_64 UEFI boot.
    bool disable_hv = 17;
}

// WindowsOptions contains virtual machine configurations that are only present on a Windows host.
message WindowsOptions {
    uint64 cpu_group_id = 1;
}

message SerialConfig {
    message Config {
        uint32 port = 1;
        // Uds to relay serial console output to.
        string socket_path = 2;
        // When true, connect to an existing pipe/socket as a client instead of
        // creating a new server listener.
        bool connect = 3;
    }
    repeated Config ports = 3;
}

message HvSocketConfig {
    string path = 1;
}

// SMBIOS (DMI) identity overrides, grouped by SMBIOS structure type to mirror
// the `type=N` grouping of the OpenVMM `--smbios` CLI option. Each unset field
// falls through to the loader's default identity.
message SmbiosConfig {
    // SMBIOS Type 0 (BIOS Information) overrides.
    message Bios {
        // System BIOS Major/Minor Release (e.g. 4.1). Presence of this message
        // sets the release; both components are supplied together.
        message Release {
            uint32 major = 1;
            uint32 minor = 2;
        }

        // BIOS vendor string.
        optional string vendor = 1;
        // BIOS version string.
        optional string version = 2;
        // BIOS release date string.
        optional string release_date = 3;
        // System BIOS Major/Minor Release. Absent => loader default.
        Release release = 4;
    }

    // SMBIOS Type 1 (System Information) overrides.
    message System {
        // System manufacturer string.
        optional string manufacturer = 1;
        // System product name string.
        optional string product_name = 2;
        // System version string.
        optional string version = 3;
        // System serial number string.
        optional string serial_number = 4;
        // System SKU number string.
        optional string sku_number = 5;
        // System family string.
        optional string family = 6;
        // System UUID (the VM's BIOS GUID).
        optional string uuid = 7; // GUID
    }

    // Type 0 (BIOS Information) overrides.
    Bios bios = 1;
    // Type 1 (System Information) overrides.
    System system = 2;
}

message CreateVmRequest {
    VmConfig config = 1;
    // Optional ID to be used by the VM service in log messages. It's up to the
    // server/virtstack to make use of this field. Useful for debugging to be able to
    // correlate events in the virtstack for a given vm that the client launched.
    optional string log_id = 2;
}

message MemoryStats {
    uint64 working_set_bytes = 1;
    uint64 available_memory  = 2;
    uint64 reserved_memory   = 3;
    uint64 assigned_memory   = 4;
}

message ProcessorStats {
    uint64 total_runtime_ns = 1;
}

message VmPropertiesRequest {
    enum PropertiesType {
        PROPERTIES_TYPE_UNSPECIFIED = 0;
        PROPERTIES_TYPE_MEMORY      = 1;
        PROPERTIES_TYPE_PROCESSOR   = 2;
    }
    repeated PropertiesType types = 1;
}

// Represents VM state.
enum VmState {
    VM_STATE_UNSPECIFIED   = 0;
    VM_STATE_UNINITIALIZED = 1;
    VM_STATE_PAUSED        = 2;
    VM_STATE_RUNNING       = 3;
    VM_STATE_HALTED        = 4; // Powered off.
    VM_STATE_TORN_DOWN     = 5;
}

message VmPropertiesResponse {
    MemoryStats memory_stats       = 1;
    ProcessorStats processor_stats = 2;
    VmState state                  = 3;
    // Set when state is Halted.
    optional string halt_reason = 4;
}

//
// Modify existing VM request/response
//

enum ResourceModifyType {
    RESOURCE_MODIFY_TYPE_UNSPECIFIED = 0;
    RESOURCE_MODIFY_TYPE_ADD         = 1;
    RESOURCE_MODIFY_TYPE_REMOVE      = 2;
    RESOURCE_MODIFY_TYPE_UPDATE      = 3;
}

message ModifyMemoryRequest {
    uint64 memory_mb = 1;
}

message ModifyProcessorRequest {
    // Index of the processor to add/remove
    uint32 processor_index = 1;
}

message ModifyProcessorConfigRequest {
    uint32 processor_weight = 1;
    uint32 processor_limit  = 2;
}

message ModifyVmResourceRequest {
    ResourceModifyType type = 1;
    oneof resource {
        ModifyProcessorRequest processor              = 2;
        ModifyProcessorConfigRequest processor_config = 3;
        ModifyMemoryRequest memory                    = 4;
        ScsiDisk scsi_disk                            = 5;
        VpmemDisk vpmem_disk                          = 6;
        NicConfig nic_config                          = 7;
        WindowsPciDevice windows_device               = 8;
    }
}

//
// PCIe device hot add/remove request/response
//
// Request to hot-add a PCIe device behind an existing port.
message AddVmPcieDeviceRequest {
    // Name of the PCIe port to plug the device into: a root port or switch
    // downstream port declared in the topology.
    string port_name = 1;
    // The device to attach.
    PciDeviceKind device = 2;
}

// Request to hot-remove the PCIe device behind a port.
message RemoveVmPcieDeviceRequest {
    // Name of the PCIe port whose device should be removed.
    string port_name = 1;
}

// Request to hot-add a PCI device over VPCI.
message AddVmVpciDeviceRequest {
    // The device to attach. VTL assignment is not modeled; this targets VTL0.
    PciDeviceKind device = 1;
    // Guest-visible VPCI instance ID. Pass this to RemoveVmVpciDevice to remove
    // the device.
    string instance_id = 2;
}

// Request to hot-remove a dynamically added VPCI device.
message RemoveVmVpciDeviceRequest {
    // Instance ID supplied to AddVmVpciDevice.
    string instance_id = 1;
}

//
// Service management
//

message CapabilitiesResponse {
    enum Resource {
        RESOURCE_UNSPECIFIED = 0;
        RESOURCE_VPMEM       = 1;
        RESOURCE_SCSI        = 2;
        RESOURCE_VPCI        = 3;
        RESOURCE_PLAN9       = 4;
        RESOURCE_VM_NIC      = 5;
        RESOURCE_MEMORY      = 6;
        RESOURCE_PROCESSOR   = 7;
    }

    message SupportedResource {
        bool add          = 1;
        bool remove       = 2;
        bool update       = 3;
        Resource resource = 4;
    }

    enum SupportedGuestOs {
        SUPPORTED_GUEST_OS_UNSPECIFIED = 0;
        SUPPORTED_GUEST_OS_WINDOWS     = 1;
        SUPPORTED_GUEST_OS_LINUX       = 2;
    }

    repeated SupportedResource supported_resources = 1;
    repeated SupportedGuestOs supported_guest_os   = 2;
}
