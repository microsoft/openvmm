syntax = 'proto3';

package vmservice;
option go_package = "vmservice";

import "vmservice.nvme.proto";
import "vmservice.virtio.proto";
import "vmservice.vfio.proto";

// An endpoint PCIe device function. Attached behind a port in the topology
// (PcieAttachment), or hot-added at runtime (AddVmPcieDevice).
message PciDeviceKind {
    oneof kind {
        // A virtio device function.
        VirtioDevice virtio = 1;
        // An NVMe controller.
        NvmeConfig nvme = 2;
        // A host PCI device assigned to the guest via VFIO.
        VfioDevice vfio = 3;
    }
}

message WindowsPciDevice {
    // e.g. PCIP\\VEN_10DE&DEV_13F2&SUBSYS_115E10DE&REV_A1\\6&17F903&0&00400000
    string instance_id = 1;
}

//
// PCIe topology
//

// The topology mirrors hardware: a root complex contains root ports, each port
// has at most one thing attached behind it (a device or a switch), and a
// switch in turn contains downstream ports that follow the same pattern. This
// makes invalid states unrepresentable (no dangling port references, no two
// devices on one port).
message PcieTopologyConfig {
    // The PCIe root complexes in the VM.
    repeated PcieRootComplex root_complexes = 1;
    // Devices that act as initiators for device-only NUMA nodes.
    repeated PcieGenericInitiator generic_initiators = 2;
}

// Associates the device behind a PCIe port with a NUMA proximity domain.
message PcieGenericInitiator {
    // Port directly upstream of the initiator device.
    string port_name = 1;
    // NUMA node for which the device is an initiator.
    uint32 node = 2;
}

// A PCIe root complex.
message PcieRootComplex {
    // Root complex name (used to reference it).
    string name = 1;
    // PCI segment number (u16).
    uint32 segment = 2;
    // Lowest valid bus number (u8).
    uint32 start_bus = 3;
    // Highest valid bus number (u8).
    uint32 end_bus = 4;
    // Low (32-bit) MMIO window size, in bytes.
    uint64 low_mmio = 5;
    // High (64-bit) MMIO window size, in bytes.
    uint64 high_mmio = 6;
    // Pin the low MMIO window base address. Absent => auto-assigned.
    optional uint64 low_mmio_base = 7;
    // Pin the high MMIO window base address. Absent => auto-assigned.
    optional uint64 high_mmio_base = 8;
    // Keep assigned BARs pinned at their addresses.
    bool preserve_bars = 9;
    // NUMA node this root complex is associated with. Absent => none.
    optional uint32 node = 10;
    // Root ports on this complex.
    repeated PciePort root_ports = 11;
    // Guest-visible IOMMU covering this root complex. Absent => none.
    PcieIommuConfig iommu = 12;
}

// Guest-visible IOMMU selection for a PCIe root complex.
message PcieIommuConfig {
    oneof kind {
        // Arm SMMUv3. Only supported for aarch64 guests.
        SmmuConfig smmu = 1;
    }
}

// Arm SMMUv3 configuration, fixed at VM creation.
message SmmuConfig {
    // Enable hardware-accelerated nested translation via Linux iommufd.
    // Requires ACPI and a nesting-capable host SMMUv3. VFIO devices behind
    // this SMMU must reference a single shared context via iommufd_id.
    // False => software emulation; VFIO assignment behind the SMMU is then
    // unsupported. Unsupported acceleration is an error, not a fallback.
    bool accel = 1;
    // Fixed output address size in bits.
    // Absent => CLI oas=auto: initially 48 bits; with acceleration, device
    // attachment before VM start adopts the physical SMMU's OAS. VM start
    // freezes the advertised value; later hot-add must be compatible.
    // A fixed value cannot exceed the physical SMMU's OAS with acceleration.
    optional uint32 oas_bits = 2;
}

// A PCIe port: a root-complex root port or a switch downstream port. Hosts at
// most one device or switch (see `attached`).
message PciePort {
    // Port name, used to target runtime hot-add (AddVmPcieDevice).
    string name = 1;
    // Allow runtime hot-plug into this port.
    bool hotplug = 2;
    // What is attached behind this port. Absent => empty port (available for
    // hotplug if `hotplug` is set).
    PcieAttachment attached = 3;
    // Device/function (`device << 3 | function`) to place this port at on its
    // bus. Absent => lowest available devfn.
    optional uint32 devfn = 4;
    // ACS capability bits exposed by this port. Absent => default capabilities.
    optional uint32 acs_capabilities_supported = 5;
    // Advertise End-to-End TLP Prefix support for downstream PASID use.
    // Defaults to false. All downstream ports of a switch must agree.
    bool pasid = 6;
}

// A PCIe switch: a set of downstream ports, each of which may have its own
// device or a nested switch attached.
message PcieSwitch {
    // Switch name.
    string name = 1;
    // Downstream ports of this switch.
    repeated PciePort downstream_ports = 2;
}

// What sits behind a PCIe port: an endpoint device or a (nested) switch.
message PcieAttachment {
    oneof kind {
        // An endpoint device.
        PciDeviceKind device = 1;
        // A nested PCIe switch.
        PcieSwitch switch = 2;
    }
}
